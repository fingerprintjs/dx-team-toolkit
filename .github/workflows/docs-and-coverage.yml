name: 'Generate docs and coverage report'
on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version to use'
        required: false
        type: string
        default: 'lts/*'
      run-after-install:
        type: string
        required: false
        description: Commands to run after installing dependencies.
      prepare-gh-pages-commands:
        required: false
        default: |
          mv docs ./gh-pages
          mv coverage/lcov-report ./gh-pages/coverage
        type: string
        description: >
          Commands to stage files for the Pages artifact. The gh-pages staging folder (named for backward compatibility) will be created automatically. Only specify the commands for moving files into it.


      skip-docs-step:
        required: false
        default: false
        type: boolean
        description: 'Skip the documentation generation step.'

jobs:
  generate-docs-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: 'Determine package manager'
        run: |
          if [[ -f "pnpm-lock.yaml" ]]; then
            echo "Using pnpm"
            echo "PACKAGE_MANAGER=pnpm" >> $GITHUB_ENV
          else
            echo "Using yarn"
            echo "PACKAGE_MANAGER=yarn" >> $GITHUB_ENV
          fi

      - if: ${{ env.PACKAGE_MANAGER == 'pnpm' }}
        name: 'Install pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: 'Install latest node version'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: ${{ env.PACKAGE_MANAGER }}

      - name: Install dependencies
        run: $PACKAGE_MANAGER install

      - name: Run after install
        run: ${{ inputs.run-after-install }}
        if: ${{ inputs.run-after-install != '' }}

      - name: Build
        run: $PACKAGE_MANAGER build

      - name: Create the docs
        if: ${{ inputs.skip-docs-step != true }}
        run: $PACKAGE_MANAGER run docs

      - name: Collect coverage report
        run: $PACKAGE_MANAGER test:coverage

      - name: Create Coverage Badges
        uses: jaywcjlove/coverage-badges-cli@998665f7962b1a3935ba8c3e786171a99436e5d1 # v2.3.0
        with:
          source: coverage/coverage-summary.json
          output: coverage/lcov-report/badges.svg

      - name: Prepare Pages artifact
        run: |
          mkdir gh-pages
          ${{ inputs.prepare-gh-pages-commands }}

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages

  deploy-pages:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    needs: generate-docs-and-coverage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
